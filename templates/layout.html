
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Salary Tracker{% endblock %}</title>

    <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light px-4">
        <a class="navbar-brand fw-bold" href="/">Salary Tracker</a>

        <div class="ms-auto">
            {% if "user_id" in session %}
                <a href="/" class="btn btn-outline-dark me-2">Dashboard</a>
                <a href="/logout" class="btn btn-dark">Log out</a>
            {% else %}
                <a href="/login" class="btn btn-outline-dark me-2">Log in</a>
                <a href="/register" class="btn btn-dark">Register</a>
            {% endif %}
        </div>
    </nav>

    <!-- Page content -->
    {% block body %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
